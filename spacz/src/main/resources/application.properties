spring.application.name=spacz
# MySQL Database Configuration
# Defaults match docker-compose.yml, so `docker compose up -d` + running the app
# with no extra config works out of the box. Override via env vars for a
# different local setup (e.g. DB_PASSWORD=mysecret ./mvnw spring-boot:run).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spacz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate/JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable Hibernate's second-level cache (optional, but can improve performance)
spring.cache.type=simple
