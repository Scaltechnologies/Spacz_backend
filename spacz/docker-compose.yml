# Own project name so it never collides with spacz-platform (whose project is also "spacz").
name: spacz-legacy

services:
  mysql:
    image: mysql:8.4
    container_name: spacz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spacz
    ports:
      # Set MYSQL_HOST_PORT (e.g. 3307) if a local MySQL already uses 3306.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - spacz-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spacz-mysql-data:
