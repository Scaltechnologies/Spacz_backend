server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  application:
    name: spacz-studyhall-service
  # Outside Docker (IDE / spring-boot:run from this directory), pick up the platform .env so the
  # DB port/password and shared secrets match the compose containers. Absent in the image: no-op.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/spacz_studyhall}
    username: ${DB_USERNAME:spacz_studyhall}
    password: ${DB_PASSWORD:${STUDYHALL_DB_PASSWORD:spacz_studyhall_dev}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

spacz:
  storage:
    # Vendor-uploaded hall photos (served from /api/studyhalls/media/...). The gateway rejects requests over 2 MB.
    hall-images-dir: ${HALL_IMAGES_DIR:./data/hall-images}
    max-image-bytes: 1887436
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
      issuer: ${JWT_ISSUER:spacz-auth}
    internal:
      api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me}
  studyhall:
    approval-required: ${STUDYHALL_APPROVAL_REQUIRED:true}
    max-images: 20
    # 60 x 60: the largest grid the layout tables (V6) and the Partner app editor allow
    max-layout-cells: 3600
  booking:
    hold-duration: ${BOOKING_HOLD_DURATION:15m}
    auto-confirm: ${BOOKING_AUTO_CONFIRM:false}
    max-days: 90
    max-advance-days: 90
    zone: ${BUSINESS_TIME_ZONE:Asia/Kolkata}
  payment:
    session-ttl: ${PAYMENT_SESSION_TTL:15m}   # online checkout session; past this the reconciliation sweep resolves/expires it
    hold-grace: 5m                            # booking hold extends to payment expiresAt + this
    gateway-config:
      cache-ttl-seconds: 60                   # admin-configured credentials cache
    mode-config:
      cache-ttl-seconds: 60                   # admin-configured PAYMENT_MODE cache
    reconcile:
      interval-ms: 300000
    refund:
      interval-ms: 120000
    pay-at-hall:
      session-ttl: ${PAY_AT_HALL_SESSION_TTL:4h}  # also capped at the end of the booking's start day
      max-code-attempts: 5
      lockout: 15m
      expiry-sweep-interval-ms: 300000
  wallet:
    commission-percent: ${WALLET_COMMISSION_PERCENT:0}      # SPACZ commission on seat price - discount, per booking
    settlement-hold: ${WALLET_SETTLEMENT_HOLD:48h}          # online earnings are withdrawable after this
    min-withdrawal: ${WALLET_MIN_WITHDRAWAL:100}
    max-withdrawal: ${WALLET_MAX_WITHDRAWAL:200000}
    max-payout-accounts: 5
  clients:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
    admin-service-url: ${ADMIN_SERVICE_URL:http://localhost:8084}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
    connect-timeout: 2s
    read-timeout: 5s

# OPTIONAL bootstrap fallback only. The normal path is an ADMIN saving the keys at
# PUT /api/admin/payment-gateway/razorpay (admin-service, encrypted), picked up within 60s without a
# restart. These are used only while admin-service has nothing configured. Leaving them unset does not
# stop the service; only online payments fail with 503 PAYMENT_GATEWAY_NOT_CONFIGURED.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
