server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  application:
    name: spacz-studyhall-service
  # Outside Docker (IDE / spring-boot:run from this directory), pick up the platform .env so the
  # DB port/password and shared secrets match the compose containers. Absent in the image: no-op.
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5432}/spacz_studyhall}
    username: ${DB_USERNAME:spacz_studyhall}
    password: ${DB_PASSWORD:${STUDYHALL_DB_PASSWORD:spacz_studyhall_dev}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

spacz:
  storage:
    # Vendor-uploaded hall photos (served from /api/studyhalls/media/...). The gateway rejects requests over 2 MB.
    hall-images-dir: ${HALL_IMAGES_DIR:./data/hall-images}
    max-image-bytes: 1887436
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
      issuer: ${JWT_ISSUER:spacz-auth}
    internal:
      api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me}
  studyhall:
    approval-required: ${STUDYHALL_APPROVAL_REQUIRED:true}
    max-images: 20
    max-layout-cells: 2500
  booking:
    hold-duration: ${BOOKING_HOLD_DURATION:15m}
    auto-confirm: ${BOOKING_AUTO_CONFIRM:false}
    max-days: 90
    max-advance-days: 90
    zone: ${BUSINESS_TIME_ZONE:Asia/Kolkata}
  clients:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
    admin-service-url: ${ADMIN_SERVICE_URL:http://localhost:8084}
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
