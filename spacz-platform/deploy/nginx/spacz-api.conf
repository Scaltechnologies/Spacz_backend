# SPACZ API site for the nginx already running on the VPS (it also serves other sites).
# Install once (see docs/DEPLOYMENT.md):
#   cp spacz-api.conf /etc/nginx/sites-available/spacz-api
#   edit server_name, then: ln -s /etc/nginx/sites-available/spacz-api /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d <server_name>        # adds HTTPS to this file
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 10m;

    location / {
        # GATEWAY_HOST_PORT from /opt/spacz/.env
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
