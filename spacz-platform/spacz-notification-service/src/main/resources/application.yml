server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: spacz-notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacz_notification}
    username: ${DB_USERNAME:spacz_notification}
    password: ${DB_PASSWORD:spacz_notification_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

spacz:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
      issuer: ${JWT_ISSUER:spacz-auth}
    internal:
      api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me}
  notifications:
    # In-app notifications older than this are deleted by the nightly cleanup.
    retention: ${NOTIFICATION_RETENTION:120d}
    # Device tokens the app has not refreshed for this long are dropped (apps re-register on every start).
    device-token-ttl: ${DEVICE_TOKEN_TTL:90d}
    # Most devices one account may register; the least recently seen are removed beyond this.
    max-devices-per-user: 10
    cleanup-cron: "0 30 3 * * *"
  push:
    fcm:
      # Firebase service-account JSON for the SPACZ Firebase project, either base64-encoded
      # (FCM_CREDENTIALS_BASE64, easiest in .env) or as a file path. Both empty = push disabled
      # (logged only); in-app notifications keep working.
      credentials-base64: ${FCM_CREDENTIALS_BASE64:}
      credentials-file: ${FCM_CREDENTIALS_FILE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
