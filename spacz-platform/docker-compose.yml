# SPACZ platform: PostgreSQL + MySQL + 5 microservices.
#   cp .env.example .env   # then set real secrets
#   docker compose up -d --build
# Only the gateway (8080) needs to be reachable by the frontend. The service ports are published
# for local debugging / Swagger and can be removed in production.

name: spacz

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [spacz]

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
  JWT_ISSUER: ${JWT_ISSUER:-spacz-auth}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in .env}
  JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [spacz]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: postgres
      # One database + one login role per service (see docker/postgres/init-databases.sh).
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD must be set in .env}
      STUDYHALL_DB_PASSWORD: ${STUDYHALL_DB_PASSWORD:?STUDYHALL_DB_PASSWORD must be set in .env}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MySQL for the legacy spacz app / partner service (database "spacz"). The platform services use
  # postgres above. Published on 3307 by default because a local MySQL often already owns 3306.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    networks: [spacz]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: spacz
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    <<: *service-defaults
    build: ./spacz-user-service
    image: spacz/user-service:latest
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/spacz_user
      DB_USERNAME: spacz_user
      DB_PASSWORD: ${USER_DB_PASSWORD}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      STUDYHALL_SERVICE_URL: http://studyhall-service:8083
      DOCUMENTS_DIR: /data/user-documents
    volumes:
      # Private student documents (Aadhaar images); never served directly.
      - userdocs:/data/user-documents
    ports:
      - "${USER_HOST_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

  studyhall-service:
    <<: *service-defaults
    build: ./spacz-studyhall-service
    image: spacz/studyhall-service:latest
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/spacz_studyhall
      DB_USERNAME: spacz_studyhall
      DB_PASSWORD: ${STUDYHALL_DB_PASSWORD}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      USER_SERVICE_URL: http://user-service:8082
      ADMIN_SERVICE_URL: http://admin-service:8084
      STUDYHALL_APPROVAL_REQUIRED: ${STUDYHALL_APPROVAL_REQUIRED:-true}
      BOOKING_AUTO_CONFIRM: ${BOOKING_AUTO_CONFIRM:-false}
      # Optional Razorpay fallback; normally an ADMIN saves the keys in the admin panel (docs/PAYMENTS.md).
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      BOOKING_HOLD_DURATION: ${BOOKING_HOLD_DURATION:-15m}
      BUSINESS_TIME_ZONE: ${BUSINESS_TIME_ZONE:-Asia/Kolkata}
      HALL_IMAGES_DIR: /data/hall-images
    volumes:
      - hallimages:/data/hall-images
    ports:
      - "${STUDYHALL_HOST_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy

  auth-service:
    <<: *service-defaults
    build: ./spacz-auth-service
    image: spacz/auth-service:latest
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/spacz_auth
      DB_USERNAME: spacz_auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      USER_SERVICE_URL: http://user-service:8082
      STUDYHALL_SERVICE_URL: http://studyhall-service:8083
      ADMIN_SERVICE_URL: http://admin-service:8084
      OTP_SMS_PROVIDER: ${OTP_SMS_PROVIDER:-log}
      OTP_EXPOSE_CODE: ${OTP_EXPOSE_CODE:-false}
      OTP_DEFAULT_COUNTRY_CODE: ${OTP_DEFAULT_COUNTRY_CODE:-+91}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${AUTH_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      studyhall-service:
        condition: service_healthy

  admin-service:
    <<: *service-defaults
    build: ./spacz-admin-service
    image: spacz/admin-service:latest
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/spacz_admin
      DB_USERNAME: spacz_admin
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      # Encrypts payment gateway secrets at rest (openssl rand -base64 32). Back it up.
      ADMIN_SECRETS_ENCRYPTION_KEY: ${ADMIN_SECRETS_ENCRYPTION_KEY:-}
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      STUDYHALL_SERVICE_URL: http://studyhall-service:8083
    ports:
      - "${ADMIN_HOST_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  # In-app + push notifications for every app. Other services send to it best effort, so nothing
  # depends on it being up. Push needs FCM_CREDENTIALS_BASE64 (SPACZ Firebase service account).
  notification-service:
    <<: *service-defaults
    build: ./spacz-notification-service
    image: spacz/notification-service:latest
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/spacz_notification
      DB_USERNAME: spacz_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      FCM_CREDENTIALS_BASE64: ${FCM_CREDENTIALS_BASE64:-}
    ports:
      - "${NOTIFICATION_HOST_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy

  gateway-service:
    <<: *service-defaults
    build: ./spacz-gateway-service
    image: spacz/gateway-service:latest
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-spacz-auth}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      STUDYHALL_SERVICE_URL: http://studyhall-service:8083
      ADMIN_SERVICE_URL: http://admin-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      studyhall-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy

networks:
  spacz:

volumes:
  pgdata:
  mysqldata:
  userdocs:
  hallimages:
