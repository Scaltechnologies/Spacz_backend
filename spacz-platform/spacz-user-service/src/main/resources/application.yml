server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: spacz-user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spacz_user}
    username: ${DB_USERNAME:spacz_user}
    password: ${DB_PASSWORD:spacz_user_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  lifecycle:
    timeout-per-shutdown-phase: 20s

spacz:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
      issuer: ${JWT_ISSUER:spacz-auth}
    internal:
      api-key: ${INTERNAL_API_KEY:dev-only-internal-api-key-change-me}
  clients:
    studyhall-service-url: ${STUDYHALL_SERVICE_URL:http://localhost:8083}
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
