# Tests run against an in-memory H2 database (MySQL mode), never the real MySQL.
spring.datasource.url=jdbc:h2:mem:spacz_partner_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-stacktrace=never
spacz.cors.allowed-origin-patterns=http://localhost:[*]
