spring.application.name=spacz-partner-service

# Same port as the legacy `spacz` backend, so the Partner app keeps using the same
# base URL. To run the legacy app (Auth / Aspirant APIs) at the same time, start
# one of them on another port, e.g. SERVER_PORT=8083.
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
# Same database and defaults as the legacy `spacz` app, so existing Partner
# data (owner, property, block, seat, amenity, image tables) is reused as-is.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spacz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate/JPA Configuration
# `update` only ever adds missing tables/columns; it never drops anything.
# The entity mappings match the existing schema exactly, so against an existing
# database it is a no-op. Set JPA_DDL_AUTO=validate to forbid any schema change.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Only create missing unique constraints; never drop/recreate existing ones.
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Responses are built from DTOs inside service transactions, so lazy loading
# during JSON serialization is neither needed nor allowed.
spring.jpa.open-in-view=false
# Loads nested lists (properties -> images/blocks -> seats) in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Never leak stack traces to API clients.
server.error.include-stacktrace=never

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

# CORS for browser-based clients (Expo web, admin tools). Native mobile apps
# are not subject to CORS. Comma-separated Spring origin patterns.
spacz.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
